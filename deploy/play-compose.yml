#
# Tracked copy of what ran untracked on the host until 2026-10-07. `coolify` is
# the external network the host's proxy routes the domain over.
#
#     docker compose -f deploy/play-compose.yml up -d --build

# Pinned: the host proxy routes to the container BY NAME (`mm-play-play-1`).
# Unpinned, compose names the project after this file's directory and the
# container becomes `deploy-play-1` — a redeploy that takes the site down.
name: mm-play

services:
  play:
    build: ..
    ports:
      # Loopback only. The domain is served over the `coolify` network, which reaches
      # the container directly; a 0.0.0.0 publish would expose the raw server past
      # the proxy, and Docker's iptables rules bypass ufw.
      - "127.0.0.1:8300:8300"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - coolify
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8300/ui/app/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  coolify:
    external: true
