        - generic [ref=f3e152]: The grid
        - heading "Seventy cells." [level=3] [ref=f3e153]
        - paragraph [ref=f3e154]: Every pair of a technique and a form is a body of magic. Twelve of them have spells written so far — the ones marked with a dot.
