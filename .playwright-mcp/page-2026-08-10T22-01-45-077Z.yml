    - generic [ref=f3e159]:
      - generic [ref=f3e160]:
        - img "An intact candlelit library archive" [ref=f3e161]
        - img "The same archive burned and collapsed" [ref=f3e162]
      - slider "Burn the archive" [ref=f3e163]: "0"
      - generic [ref=f3e164]:
        - generic [ref=f3e165]: Standing
        - generic [ref=f3e166]: Ash
    - generic [ref=f3e167]:
      - generic [ref=f3e168]: Knowledge is a physical thing
      - heading [level=2] [ref=f3e169]:
        - text: A spell lives
        - emphasis [ref=f3e170]: somewhere
        - text: .
      - paragraph [ref=f3e171]: In a mage's mind. In a grimoire. On a library's shelves. Under one tradition, in a memory palace that cannot burn and cannot be lent — and dies with the person holding it.
      - paragraph [ref=f3e172]: Kill the last mage who knew it and burn the book, and it is gone. Not disabled. Gone — until someone derives it again from first principles, at a cost far above learning it from a living teacher.
      - paragraph [ref=f3e173]: Which is why a raid is rarely about killing anyone. It is about reaching the archive.
  - generic [ref=f3e174]:
    - generic [ref=f3e175]:
      - generic [ref=f3e176]: They do this without you
      - heading "Your mages are academics, and they have careers." [level=2] [ref=f3e177]
      - paragraph [ref=f3e178]: You bless, you fund, you forbid, and you grant a chosen scholar the founding knowledge of something nobody in your world has ever known. You never give an order — not even in a raid. They research, teach, write, age, and die on their own.
    - generic [ref=f3e179]:
      - img "An elderly dwarf archivist holding a heavy grimoire" [ref=f3e180]
      - img "An iron-bound grimoire with glowing script" [ref=f3e181]
    - generic [ref=f3e182]:
      - generic [ref=f3e183]:
        - term [ref=f3e184]: Human · 80 years
        - definition [ref=f3e185]: Curious and numerous. Loses knowledge constantly to mortality.
      - generic [ref=f3e186]:
        - term [ref=f3e187]: Dwarf · 250 years
        - definition [ref=f3e188]: Incurious, but the finest archivists. Dwarven books resist burning.
      - generic [ref=f3e189]:
        - term [ref=f3e190]: Gnome · 350 years
        - definition [ref=f3e191]: Wildly curious, poor retention. Best at rediscovering what was lost.
      - generic [ref=f3e192]:
        - term [ref=f3e193]: Draconic · 1,500 years
        - definition [ref=f3e194]: Barely curious, learns slowly. Reaches depths nobody else can.
  - generic [ref=f3e195]:
    - generic [ref=f3e196]:
      - generic [ref=f3e197]: Where the project actually is
      - heading "Pre-alpha. Balanced by machines first, in the open." [level=2] [ref=f3e198]
      - paragraph [ref=f3e199]: Real-time strategy is hard to get right, so this one is deterministic and headless before it is attractive. Monte Carlo sweeps and learning agents get to find the meta before any human does. There is no build to download and nothing to wishlist — the design documents and the source are public and readable today.
