#
# Run with: docker compose up -d --build
# The game is then at http://localhost:8300/ui/app/

services:
  play:
    build: .
    ports:
      - "8300:8300"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8300/ui/app/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
