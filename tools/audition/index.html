<meta charset="utf-8">
<title>Multiverse Mages — audition</title>
<style>
  :root {
    --ground:#ece7de; --panel:#f5f2eb; --panel-2:#e2dcd0; --line:#c8c0b1;
    --ink:#17191c; --soft:#55595f; --faint:#8a8d93;
    --brass:#9a6b1f; --verdigris:#2f6f60; --ember:#a83a2c;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans: ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    --serif:"Iowan Old Style",Palatino,"Book Antiqua",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0f1216; --panel:#171b21; --panel-2:#1f242c; --line:#2c333d;
    --ink:#dfe3e8; --soft:#99a1ac; --faint:#6a737f;
    --brass:#c08a3e; --verdigris:#58a08d; --ember:#d1594a;}}
  :root[data-theme="dark"]{
    --ground:#0f1216; --panel:#171b21; --panel-2:#1f242c; --line:#2c333d;
    --ink:#dfe3e8; --soft:#99a1ac; --faint:#6a737f;
    --brass:#c08a3e; --verdigris:#58a08d; --ember:#d1594a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);height:100vh;display:flex;flex-direction:column}
  header{padding:.7rem 1rem;border-bottom:1px solid var(--line);display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
  h1{font:400 1.1rem var(--serif);margin:0;white-space:nowrap}
  #filter{flex:1;min-width:12rem;font:14px var(--mono);padding:.45rem .6rem;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:3px}
  #filter:focus{outline:2px solid var(--brass);outline-offset:1px}
  .stat{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .stat b{color:var(--verdigris);font-weight:600}
  main{flex:1;display:grid;grid-template-columns:22rem 1fr;min-height:0}
  #list{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
  .row{padding:.4rem .75rem;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--line) 40%,transparent);display:flex;gap:.5rem;align-items:baseline}
  .row:hover{background:var(--panel-2)}
  .row[aria-current="true"]{background:color-mix(in srgb,var(--brass) 18%,var(--panel-2));border-left:3px solid var(--brass);padding-left:calc(.75rem - 3px)}
  .row .id{font:12px var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .n{font:10px var(--mono);color:var(--faint)}
  .row .tick{color:var(--verdigris);font-weight:700}
  .row[data-chosen="false"] .tick{visibility:hidden}
  #detail{overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
  .aid{font:400 1.5rem var(--serif);margin:0}
  .meta{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
  .quote{font:400 1.15rem/1.5 var(--serif);border-left:3px solid var(--line);padding-left:.9rem;margin:0;color:var(--ink)}
  .note{font-size:.85rem;color:var(--soft);max-width:60ch;margin:0}
  ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.3rem;max-width:34rem}
  li{display:flex;gap:.6rem;align-items:center;padding:.45rem .6rem;border:1px solid var(--line);border-radius:3px;background:var(--panel);cursor:pointer}
  li:hover{border-color:var(--brass)}
  li[data-playing="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 12%,var(--panel))}
  li[data-chosen="true"]{border-color:var(--verdigris);background:color-mix(in srgb,var(--verdigris) 14%,var(--panel))}
  li .k{font:11px var(--mono);color:var(--faint);width:1.2rem}
  li .f{font:12px var(--mono);flex:1}
  li .c{font:10px var(--mono);color:var(--verdigris);letter-spacing:.08em;text-transform:uppercase}
  li[data-chosen="false"] .c{visibility:hidden}
  .bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  button{font:inherit;color:inherit;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:.45rem .8rem;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--brass)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible,li:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font:11px var(--mono)}
  .hint{font:11px var(--mono);color:var(--faint)}
  .empty{color:var(--faint);padding:2rem;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>Audition</h1>
  <input id="filter" placeholder="filter — try: orc, dwarf-annoy, click, loss   ( / to focus )" autocomplete="off">
  <span class="stat" id="cov">—</span>
</header>

<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Loading…</div></div>
</main>

<script type="module">
  import { mergeSelections, selectionCoverage } from '../../packages/content/dist/audio-selection-merge.js';

  let assets = [], ctx = {}, selections = {}, view = [], index = 0, playing = null;
  const audio = new Audio();
  const $ = (id) => document.getElementById(id);

  async function load() {
    const r = await fetch('/api/assets');
    const d = await r.json();
    assets = d.assets; ctx = d.context; selections = d.selections ?? {};
    applyFilter($('filter').value);
  }

  function applyFilter(q) {
    const terms = q.toLowerCase().split(/\s+/u).filter(Boolean);
    view = assets.filter((a) => terms.every((t) => a.id.toLowerCase().includes(t)
      || (ctx[a.id]?.text ?? '').toLowerCase().includes(t)
      || (ctx[a.id]?.meta ?? '').toLowerCase().includes(t)));
    if (index >= view.length) index = 0;
    renderList(); renderDetail(); renderCoverage();
  }

  function renderList() {
    const el = $('list'); el.replaceChildren();
    for (const [i, a] of view.entries()) {
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.chosen = String(Boolean(selections[a.id]));
      if (i === index) row.setAttribute('aria-current', 'true');
      row.innerHTML = `<span class="tick">✓</span><span class="id">${a.id}</span><span class="n">${a.takes.length}</span>`;
      row.addEventListener('click', () => { index = i; playing = null; renderList(); renderDetail(); });
      el.append(row);
    }
    el.querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest' });
  }

  function renderDetail() {
    const el = $('detail'); el.replaceChildren();
    const a = view[index];
    if (!a) { el.innerHTML = '<div class="empty">Nothing matches that filter.</div>'; return; }
    const c = ctx[a.id] ?? {};
    const head = document.createElement('div');
    head.innerHTML = `<div class="meta">${c.meta ?? 'asset'}</div><h2 class="aid">${a.id}</h2>`;
    el.append(head);
    if (c.text) { const q = document.createElement('p'); q.className = 'quote'; q.textContent = c.kind === 'line' ? `“${c.text}”` : c.text; el.append(q); }
    if (c.note) { const n = document.createElement('p'); n.className = 'note'; n.textContent = c.note; el.append(n); }

    const ol = document.createElement('ol');
    a.takes.forEach((take, i) => {
      const li = document.createElement('li');
      li.tabIndex = 0;
      li.dataset.playing = String(playing === i);
      li.dataset.chosen = String(selections[a.id] === take);
      li.innerHTML = `<span class="k">${i < 9 ? i + 1 : '·'}</span><span class="f">${take}</span><span class="c">chosen</span>`;
      li.addEventListener('click', () => play(i));
      li.addEventListener('dblclick', () => choose(i));
      ol.append(li);
    });
    el.append(ol);

    const bar = document.createElement('div');
    bar.className = 'bar';
    const more = document.createElement('button');
    more.textContent = '+4 more takes';
    more.addEventListener('click', async () => {
      more.disabled = true; more.textContent = 'generating…';
      const res = await (await fetch('/api/regen', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ assetId: a.id, extra: 4 }) })).json();
      more.textContent = res.ok ? `now ${res.to} takes` : (res.error ?? 'failed');
      await load();
      more.disabled = false;
    });
    const un = document.createElement('button');
    un.textContent = 'un-choose';
    un.addEventListener('click', () => choose(null));
    bar.append(more, un);
    const hint = document.createElement('span');
    hint.className = 'hint';
    hint.innerHTML = '<kbd>1</kbd>–<kbd>9</kbd> play · <kbd>enter</kbd> choose · <kbd>x</kbd> un-choose · <kbd>n</kbd>/<kbd>p</kbd> move · <kbd>r</kbd> regen · <kbd>/</kbd> filter';
    bar.append(hint);
    el.append(bar);
  }

  function renderCoverage() {
    const { total, chosen } = selectionCoverage(assets.map((a) => ({ id: `${a.id}-take1` })), selections);
    $('cov').innerHTML = `<b>${chosen}</b> / ${total} chosen · ${view.length} shown`;
  }

  function play(i) {
    const a = view[index]; if (!a?.takes[i]) return;
    playing = i;
    audio.src = `/audio/${a.id}/${a.takes[i]}`;
    void audio.play();
    renderDetail();
  }

  async function choose(i) {
    const a = view[index]; if (!a) return;
    const take = i === null ? null : a.takes[i ?? playing ?? 0];
    selections = mergeSelections(selections, { [a.id]: take });
    await fetch('/api/select', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ assetId: a.id, take }) });
    renderList(); renderDetail(); renderCoverage();
  }

  $('filter').addEventListener('input', (e) => applyFilter(e.target.value));
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== $('filter')) { e.preventDefault(); $('filter').focus(); return; }
    if (document.activeElement === $('filter')) {
      if (e.key === 'Escape') { $('filter').blur(); }
      if (e.key !== 'Enter') return;
      e.preventDefault(); $('filter').blur(); return;
    }
    if (e.key >= '1' && e.key <= '9') play(Number(e.key) - 1);
    else if (e.key === 'Enter') { e.preventDefault(); if (playing !== null) void choose(playing); }
    else if (e.key === 'x') void choose(null);
    else if (e.key === 'n') { index = Math.min(index + 1, view.length - 1); playing = null; renderList(); renderDetail(); }
    else if (e.key === 'p') { index = Math.max(index - 1, 0); playing = null; renderList(); renderDetail(); }
    else if (e.key === 'r') document.querySelector('#detail button')?.click();
  });

  await load();
</script>
