# Multiverse Mages — continuous integration.
# Copyright (C) 2026 Ann Kelner
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The pinned job is the gate. The next-major job is an early-warning signal for
# cross-version determinism drift and must never block a merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keyed on the *branch the code is on*, not on `github.ref`, which names two
# different things for the two events that fire for one commit: `refs/heads/foo`
# for the push, `refs/pull/<n>/merge` for the pull_request. Those are different
# groups, so neither run cancelled the other and every PR-branch SHA ran the
# whole matrix twice — measured on c02fb481 as four jobs and 1655 s of compute to
# produce one 443 s required status, with 26 of the last 100 runs duplicates.
#
# The two expressions below are deliberately built from the *same* pair, because
# `cancel-in-progress` is a property of the incoming run but its effect lands on
# older runs already in the group. A guard that varies run by run inside one
# group — the obvious `github.ref != 'refs/heads/main'` — can therefore let a run
# whose own ref is not main cancel a main run that is. Deriving the group and the
# guard from one pair makes the guard constant per group, which is the property
# that makes it sound.
#
#   effective repo = head repo of the PR, else this repo
#   effective ref  = head branch of the PR, else the pushed/dispatched branch
#
# The repo component is not decoration: without it a fork PR whose head branch is
# named `main` would land in this repository's `main` group and could cancel a
# real `main` run, leaving a merge commit with no green on record. With it, forks
# get their own groups and `main` runs serialise instead of superseding each
# other.
#
# **A cancelled run's checks DO mask a green one, and this comment used to claim
# otherwise.** An earlier version asserted that "the newest check run for a given
# name always belongs to the survivor". It does not: GitHub's `filter=latest` is
# per check *suite*, and one commit on a PR branch produced *two* suites — one per
# event. The cancelled suite's `Verify (pinned Node)` stays attached to the commit
# and stays `required=true`, so branch protection sees a required check in
# CANCELLED state and refuses the merge. Observed on PR #42 with both contexts
# green:
#
#     CHECK Verify (pinned Node) CANCELLED required=true
#     CHECK Verify (pinned Node) SUCCESS   required=true
#
# `--admin` is unavailable (ruleset `bypass_actors: []`), so the only recovery was
# rerunning the required job inside the dead suite by hand. Every push to a PR
# branch reproduced it.
#
# So `push:` is narrowed to `main`, which achieves what the cancellation was for
# — the duplicate was measured at four jobs and 1655 s of compute to produce one
# 443 s required status, 26 of the last 100 runs — *without* minting a cancelled
# required check. One event per commit, one suite, nothing to mask.
#
# The cost is real and smaller than it looks: a branch pushed before its PR exists
# now gets no Actions run. It already got no `ci/hetzner-lint` either — the
# self-hosted receiver's `WATCHED_BRANCHES` is `{main, production}` — so that
# window was never gated by anything, and it is exactly the window where a gate
# has nothing to protect. Once the PR exists, `pull_request` fires on every push
# and both systems run.
#
# `pull_request:` must never be narrowed at all: fork PRs generate no push event,
# and this workflow is the only gate that may safely see a fork.
# ## Why `main` runs are grouped per commit and everything else per branch
#
# `cancel-in-progress` is false for `main` on purpose: a run on `main` must never
# be killed mid-flight. But GitHub keeps **only one pending run per group**, so a
# false `cancel-in-progress` does not mean "every commit is verified" — it means
# every commit *queues*, and each queued run is cancelled by the next one to
# arrive. Cancelled before it ever started, not interrupted.
#
# That is not hypothetical. Measured on 2026-08-14, `main`'s last eight runs held
# three `cancelled` and exactly one `success`, and the tree went hours with no
# confirmed `Verify` while every individual PR was green. `72d9538`, `fbb9dcb`
# and `14155e7` were never verified at all.
#
# The cause is throughput. `Balance gate, two hundred world years` takes ~35
# minutes and sits in this workflow, so the *run* holds the group for ~40 minutes
# even though `Verify (pinned Node)` finishes in about eight. A second commit
# inside that window queues; a third cancels the second. The comment on that job
# says "nothing blocks on this job" — true of the merge gate, and false of the
# next commit's verification, which is what this group made it block.
#
# Adding the SHA to the group for `main` gives every `main` commit its own group,
# so none can cancel another and each is verified on its own merits. Branch and
# PR runs keep the shared group and keep cancelling supersedes, which is what you
# want there and costs nothing — this repository is public, so Actions minutes
# are unmetered.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ (github.event_name == 'push' && github.ref_name == 'main') && github.sha || '' }}
  cancel-in-progress: ${{ (github.event.pull_request.head.repo.full_name || github.repository) != github.repository || (github.event.pull_request.head.ref || github.ref_name) != 'main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (pinned Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency-purity check
        run: npm run check:purity

      - name: Content validation
        run: npm run check:content

      - name: Audio content validation
        run: npm run check:audio

      - name: Primitive coverage over v1 content
        run: npm run check:coverage

      - name: Generated UI artifacts (built here, not committed)
        # `ui/session.json` and `ui/design-dashboard/data.json` are pure
        # functions of the repository and are built rather than committed, so
        # the thing to gate is what makes that safe: each generator is
        # deterministic (run twice, bytes compared) and neither artifact is
        # tracked. It needs no credentials, no network and no services — two
        # node scripts over the tree — which is what makes it safe here, in the
        # only job that may see a fork pull request.
        #
        # Exit 42 is a finding; exit 1 is the generator itself being broken, and
        # the two are deliberately not the same answer. Listed here by hand
        # because this workflow lists its steps by hand; the self-hosted runner
        # picks it up through `npm run verify`. Both, or the two gates disagree.
        run: npm run check:generated

      - name: Test (unit + golden replay)
        run: npm test

      # The three balance gates are deliberately NOT here any more, since
      # 2026-08-14. They run in the `balance` job below, on every commit, and
      # are required at release rather than at merge. See that job for why, and
      # for the condition under which they come back.

      # `check:consumption` is deliberately NOT here. It is expected to be red
      # until the effect pipeline is wired, so it runs in its own non-blocking
      # job at the bottom of this file. See that job for the condition under
      # which it moves back into this one. `check:reachability` is absent for
      # the same reason and sits in the job below it.

  next-node:
    # Early warning only: a failure here means the next Node major may change
    # simulation behaviour, which we want to know about before it is pinned.
    # Node 23 is skipped deliberately — odd majors are already end-of-life.
    name: Next Node major (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `engines` pins Node 22, so npm prints an EBADENGINE warning here. That is
      # intended: the warning is the point, and engine-strict is left off so the
      # early-warning job can still run.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency-purity check
        run: npm run check:purity

      - name: Content validation
        run: npm run check:content

      - name: Audio content validation
        run: npm run check:audio

      - name: Primitive coverage over v1 content
        run: npm run check:coverage

      - name: Generated UI artifacts (built here, not committed)
        # `ui/session.json` and `ui/design-dashboard/data.json` are pure
        # functions of the repository and are built rather than committed, so
        # the thing to gate is what makes that safe: each generator is
        # deterministic (run twice, bytes compared) and neither artifact is
        # tracked. It needs no credentials, no network and no services — two
        # node scripts over the tree — which is what makes it safe here, in the
        # only job that may see a fork pull request.
        #
        # Exit 42 is a finding; exit 1 is the generator itself being broken, and
        # the two are deliberately not the same answer. Listed here by hand
        # because this workflow lists its steps by hand; the self-hosted runner
        # picks it up through `npm run verify`. Both, or the two gates disagree.
        run: npm run check:generated

      - name: Test (unit + golden replay)
        run: npm test

      - name: Balance regression gate (five world years)
        # The committed baseline for the gate sweep, compared metric by metric.
        # Fails the build when a gated metric moves beyond its tolerance, and
        # equally when the baseline is missing — a gate that passes without one
        # reports green forever. Listed here by hand because this workflow does;
        # the self-hosted runner picks it up through `npm run verify`, which the
        # script is also part of. Both, or the two gates disagree.
        run: npm run balance:gate

      - name: Balance regression gate (twenty world years)
        # The same four cells and the same 200 runs, run to world-year twenty
        # instead of five, against its own baseline. It is a separate step and
        # not a longer version of the one above because the two answer different
        # questions: the fast gate is sensitive and cheap, and this one can see a
        # plateau that has not started yet at year five. Deleting either leaves a
        # blind spot the other does not cover — balance/README.md has the
        # measurements, and horizon-gate.test.ts fails if this step goes missing.
        run: npm run balance:gate:horizon

      - name: Balance regression gate (twenty world years, eight strategies)
        # Same horizon as the step above and a different pool, which is the
        # entire point. The two gates above run `passive-control` fixed, and
        # `passive-control` declares an empty preference list — so between them
        # their 400 runs submit no god intervention at all, and no change to any
        # of the fifteen verbs in coordination/src/god/interventions.ts can move
        # either of them by construction. That blind spot used to be covered
        # only by the two-hundred-year gate below, the most expensive instrument
        # here. This one covers it in about nine seconds. The single declared
        # difference from the step above is the pool, so a divergence between
        # them is attributable to god agency and to nothing else —
        # horizon-gate.test.ts fails if that stops being true.
        run: npm run balance:gate:agency

      # `check:consumption` is deliberately NOT here. It is expected to be red
      # until the effect pipeline is wired, so it runs in its own non-blocking
      # job at the bottom of this file. See that job for the condition under
      # which it moves back into this one. `check:reachability` is absent for
      # the same reason and sits in the job below it.

  balance:
    # The three Monte Carlo balance gates, run on every commit and required at
    # release rather than at merge — the same move the `ascension` job below
    # made on 2026-08-13, for the same reason, one rung down the cost ladder.
    #
    # ## Why they left `verify`
    #
    # They were the entire cost of checking a commit once the cheap checks are
    # discounted, and the cost is not paid on the hosted runner alone: the
    # self-hosted runner **serialises** against a 2400 s timeout, so every
    # sweep-bearing commit is a queue hazard for every other pull request, and
    # `scripts/ci-check.sh` already skips them for docs-only changes for exactly
    # this reason. What that skip cannot help is the case that actually hurts —
    # a **campaign**, where every commit touches `packages/` and therefore pays
    # the full sweep, several agents deep, on one box. Measured during the
    # integration-debt campaign: load average above 300 sustained, with test
    # timeouts that were load and not defects.
    #
    # ## And a balance gate is the wrong question at merge
    #
    # A gate asks "did this change the game's numbers". During a campaign that
    # is deliberately moving numbers, the answer is *yes, on purpose* — so the
    # gate fires, is read as expected, and is ignored, while still costing the
    # time. `balance/README.md`'s own rule: *a gate that takes ten minutes gets
    # deleted*, and a gate people route around is worse than no gate, because it
    # still costs the time and no longer earns the trust.
    #
    # Where they belong is where they make a claim someone could check.
    # `release-plan.md` already says it: **MINOR parity encodes balance
    # validation** — even MINOR means the baselines are committed and green.
    # That is a release statement, not a merge statement.
    #
    # ## When to make this blocking again
    #
    # Move these steps back into the two verify jobs above — and back into
    # `npm run verify` in package.json, so `scripts/ci-check.sh` picks them up
    # through the same gate — when the sweeps are fast enough that a commit does
    # not queue behind them, or when a campaign is no longer the normal mode of
    # work here. Neither is true on 2026-08-14.
    #
    # `npm run verify:balance` runs exactly these three, and `verify:full` runs
    # everything including the two-hundred-year gate. Neither this job nor the
    # `ascension` job below is a required status check; **`release-plan.md` is
    # what makes them required at release**, and a release that skips them is
    # taking an even MINOR without the evidence the scheme exists to carry.
    name: Balance gates (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run typecheck
      - name: Balance regression gate (five world years)
        # The committed baseline for the gate sweep, compared metric by metric.
        # Fails the build when a gated metric moves beyond its tolerance, and
        # equally when the baseline is missing — a gate that passes without one
        # reports green forever. Listed here by hand because this workflow does;
        # the self-hosted runner picks it up through `npm run verify`, which the
        # script is also part of. Both, or the two gates disagree.
        run: npm run balance:gate

      - name: Balance regression gate (twenty world years)
        # The same four cells and the same 200 runs, run to world-year twenty
        # instead of five, against its own baseline. It is a separate step and
        # not a longer version of the one above because the two answer different
        # questions: the fast gate is sensitive and cheap, and this one can see a
        # plateau that has not started yet at year five. Deleting either leaves a
        # blind spot the other does not cover — balance/README.md has the
        # measurements, and horizon-gate.test.ts fails if this step goes missing.
        run: npm run balance:gate:horizon

      - name: Balance regression gate (twenty world years, eight strategies)
        # Same horizon as the step above and a different pool, which is the
        # entire point. The two gates above run `passive-control` fixed, and
        # `passive-control` declares an empty preference list — so between them
        # their 400 runs submit no god intervention at all, and no change to any
        # of the fifteen verbs in coordination/src/god/interventions.ts can move
        # either of them by construction. That blind spot used to be covered
        # only by the two-hundred-year gate below, the most expensive instrument
        # here. This one covers it in about nine seconds. The single declared
        # difference from the step above is the pool, so a divergence between
        # them is attributable to god agency and to nothing else —
        # horizon-gate.test.ts fails if that stops being true.
        run: npm run balance:gate:agency


  ascension:
    # The two-hundred-year balance gate, run on every commit and required at
    # release rather than at merge.
    #
    # ## Why it is not in `verify` any more
    #
    # It measures the win condition, and it is the only instrument that can:
    # 0 of 400 runs ascend at twenty world years and 46 of 64 at two hundred, so
    # every other gate is structurally blind to the ending of the game. It is
    # also, now, the entire cost of checking a commit. Measured 2026-08-12 on the
    # merged tree: **830 s on a quiet eight-core machine and 1154 s while three
    # sibling worktrees were building**, against 83 s for the same sweep a day
    # earlier. The sweep did not change; the simulation got heavier — mean
    # population 5,400 to 15,764, living mages 70 to 468.
    #
    # `balance/README.md` states this repository's own rule: *a gate that takes
    # ten minutes gets deleted*, and a gate people route around is worse than no
    # gate, because it still costs the time and no longer earns the trust. On the
    # self-hosted runner it is worse than slow — that runner serialises, against a
    # 2400 s timeout, so a twenty-minute `verify` is a queue hazard for every
    # other pull request.
    #
    # So the win condition moves to where the claim it supports actually lives.
    # `docs/design/release-plan.md` makes MINOR parity mean "even = Monte Carlo
    # baselines committed and green" — a **release-time** claim — and this job is
    # what substantiates it. Taking an even MINOR without this job green is
    # precisely the failure the parity scheme exists to prevent, and the release
    # checklist now says so by name.
    #
    # ## Why it is here and not merely per-release
    #
    # GitHub Actions is free and unmetered for this public repository, so running
    # it on every commit costs nothing but wall clock nobody is waiting on. Held
    # to release time only, a regression would surface weeks after the commit
    # that caused it, with the bisect range to match.
    #
    # Measured here on 2026-08-13: **35m09s**, against 830 s on an eight-core
    # laptop — a hosted runner has fewer cores and `--workers 4` oversubscribes
    # them. That is fine and is not a thing to optimise: nothing blocks on this
    # job, and trimming `--workers` or the replicate count would buy minutes
    # nobody is waiting for at the cost of the sensitivity the sweep exists for.
    # If it ever needs to be fast, `docs/devops/sweep-fanout.md` is the lever —
    # but read why that is wrong for a *required* gate before reaching for it.
    #
    # ## Why it has no `continue-on-error`, unlike the two jobs below
    #
    # Those two are *expected* red and say so. This one is expected **green**, so
    # a failure here is a real finding and must look like one. It is non-blocking
    # because it is not in this repository's required status checks — which are
    # `Verify (pinned Node)` and `ci/hetzner-lint`, and are configured in branch
    # protection rather than here — and not because its result is soft. Red here
    # means the win condition moved: read the delta, do not re-run until green.
    name: Balance gate, two hundred world years (not required to merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # `prebalance:gate:ascension` runs this too; naming it as its own step
      # makes a build failure land on "Typecheck" rather than inside the gate,
      # where it would read as a balance regression.
      - name: Typecheck
        run: npm run typecheck

      - name: Balance regression gate (two hundred world years)
        # It needs no credentials, no network and no services — `npm ci`, a
        # typecheck and a deterministic simulation — which is what makes it safe
        # to run in the only job that may see a fork pull request.
        run: npm run balance:gate:ascension

  consumption:
    # The measurement that says how much of the authored magic reaches the
    # simulation, reported on every commit and blocking nothing.
    #
    # `check:coverage` asks whether content *authors* each primitive; this asks
    # whether an authored node effect reaches anything the assembled simulation
    # applies. It is expected to be RED — at the time this job was split out,
    # 2 of 14 primitives were reachable from authored nodes, 2 were declared
    # exclusions, and 12 had no node-driven consumer at all. That is the finding
    # the check exists to publish, not a regression to be silenced.
    #
    # It is non-blocking because the wire that would turn it green (`w29`'s
    # `universe-effects.ts`, PR #42) is a different pull request. A gate held in
    # `npm run verify` while the thing it measures is unfixed cannot merge, and
    # the check that cannot merge is the check nobody sees.
    #
    # ## When to make this blocking again
    #
    # Move this step back into the two jobs above — and back into `verify` and
    # `verify:nosweeps` in package.json, so `scripts/ci-check.sh` picks it up
    # through the same gate — when, and only when:
    #
    #   every primitive has a node-driven consumer, or the remaining ones are
    #   declared exclusions
    #
    # "Declared exclusions" means the list in `packages/rules-magic/src/effects/
    # consumption.ts`, which is `fertility` and `lifespan` and has a reason:
    # both sit on 22 non-v1 nodes and are moved by species traits and blessing
    # constants rather than by anything a mage can learn. **Adding a primitive
    # to that list to make this job green is the exact failure the check exists
    # to catch.** The number in the FAIL line going down is the progress; the
    # list getting longer is not.
    name: Primitive consumption (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The check imports the built `dist/` of `content`, `rules-magic` and
      # `scenario`, because it assembles a real universe rather than grepping
      # sources. `typecheck` is `tsc --build`, so this is the build step.
      - name: Typecheck
        run: npm run typecheck

      - name: Primitive consumption (can knowledge move each primitive?)
        run: npm run check:consumption

  baselines:
    # Do the committed baselines name the content they were taken on?
    #
    # A second, against the gates' minutes. `balance` and `ascension` answer
    # *"did a metric move"*; this answers the strictly weaker *"is this baseline
    # even about this build"*, and a gate whose baseline names another revision
    # reports `baseline-invalid` and compares nothing at all.
    #
    # ## Why it exists
    #
    # The three Monte Carlo gates left `npm run verify` on 2026-08-14 for a good
    # reason, recorded in the `balance` job below: they were the whole cost of
    # checking a commit, the self-hosted runner serialises, and during a
    # campaign every commit is sweep-bearing. **Two days later all four
    # baselines were stale** — `main`'s content revision had moved and nothing
    # had been re-recorded, because a red pull request is what used to force it
    # and there are no red pull requests when the gate does not block.
    #
    # Moving a gate off the blocking path does not reduce it to "runs less
    # often". It removes the only thing that was maintaining its baseline. This
    # restores the forcing signal without restoring the cost.
    #
    # ## When to make this blocking
    #
    # Put `check:baselines` into `verify` — and therefore into
    # `scripts/ci-check.sh` through the same gate — once every baseline names
    # the current revision. Adding it while four of four are stale would block
    # every unrelated pull request on a re-record nobody has scheduled, which is
    # the failure the split of 2026-08-14 was avoiding.
    name: Baseline freshness (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # It reads the *loader's* revision rather than the literal pinned in
      # `interning.test.ts`, so it needs the build: a stale test and a stale
      # baseline agreeing with each other would otherwise pass.
      - name: Typecheck
        run: npm run typecheck

      - name: Do the baselines name this content?
        run: npm run check:baselines

  reachability:
    # The same question as `consumption`, one level down: `check:consumption`
    # asks whether an authored *primitive* reaches the simulation; this asks
    # whether a rules-path *symbol* is called by anything that is not a test.
    #
    # It exists because W85 found three university subsystems — `advanceConstruction`,
    # `applyLibraryUpkeep` and `UNIVERSITY_STAFF` — that were built, tested,
    # exported, discussed in prose, and never invoked. Two have since been wired
    # (ef3bba9 and 9a3b6b5); the third has not. The lesson recorded there is the
    # one this job mechanises: **"the symbol exists" and "a test covers it" are
    # both compatible with "the game never runs it."**
    #
    # The underlying check is RED and is meant to be: 125 findings on the tree
    # this job's gate was pinned against. That is the finding it exists to
    # publish, not a regression to be silenced, and it is far too large to hold
    # inside `npm run verify`: a gate that cannot merge is a gate nobody sees.
    #
    # ## What changed, and why the job is no longer `continue-on-error`
    #
    # For as long as this job could only be red, it carried no information.
    # Finding 126 looked exactly like findings 1..125, so the only reader who
    # learned anything from a red run was one who had memorised the previous
    # one. `completeAffiliation` was reported here for weeks; four separate
    # investigations then rediscovered it independently, each at the cost of
    # hours, because *nobody could tell a new finding from the standing pile.*
    #
    # So the report is still published — the first step, which is allowed to
    # fail, prints all 125 with the argument for each — and the *gate* is now
    # the ratchet in the second step. It fails only when the reported set stops
    # matching `scripts/reachability-baseline.json`: a new finding, a pinned one
    # that disappeared without the baseline being updated, or one that changed
    # category. That makes this job meaningful today rather than after somebody
    # fixes a hundred-odd symbols.
    #
    # Removing `continue-on-error` therefore makes the job able to *fail*; it
    # does not make it *required*. The two required contexts are configured in
    # the repository ruleset — `Verify (pinned Node)` and `ci/hetzner-lint` —
    # and changing that set is the owner's call, not this workflow's.
    #
    # The ratchet is also deliberately absent from `verify` and
    # `verify:nosweeps`, which is what keeps `scripts/ci-check.sh` equivalent to
    # `npm run verify`. Adding it there would make it blocking through the back
    # door, via a required context. `check:consumption` is out for the same
    # reason and by the same mechanism.
    #
    # ## When to make the underlying check blocking
    #
    # Move `check:reachability` itself into the two jobs above — and into
    # `verify` and `verify:nosweeps` — when, and only when:
    #
    #   the finding count is small enough that a pull request adding one symbol
    #   ahead of its caller is a conversation rather than a blockage
    #
    # A reasonable reading of that is "under ten", reached by wiring or deleting,
    # never by lengthening `DECLARED_EXCLUSIONS` in the script. Every entry there
    # is a finding the check will never make again, and each carries a written
    # argument for exactly that reason.
    name: Rules-path reachability ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The check parses TypeScript sources with the compiler API and reads no
      # build output, so there is no typecheck step here. `npm ci` is only for
      # `typescript` itself.
      - name: Install
        run: npm ci

      # The report, in full, with the argument for every finding. This is the
      # thing a reader opens the job to read, so it must run even though it is
      # red — and it is red on every tree that has a backlog, hence the guard.
      - name: Reachability report (does anything call this?)
        continue-on-error: true
        run: npm run check:reachability

      # The gate. Exit 0 = the reported findings are exactly the pinned ones;
      # 42 = the set drifted in either direction; 1 = the probe itself broke,
      # which is a different answer from "no new findings" and must not be
      # folded into it. `scripts/w117-gate-check.sh` is the model.
      - name: Reachability ratchet (any finding not already pinned?)
        run: npm run check:reachability:ratchet
