#
# The pinned job is the gate. The next-major job is an early-warning signal for
# cross-version determinism drift and must never block a merge.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Keyed on the *branch the code is on*, not on `github.ref`, which names two
# different things for the two events that fire for one commit: `refs/heads/foo`
# for the push, `refs/pull/<n>/merge` for the pull_request. Those are different
# groups, so neither run cancelled the other and every PR-branch SHA ran the
# whole matrix twice — measured on c02fb481 as four jobs and 1655 s of compute to
# produce one 443 s required status, with 26 of the last 100 runs duplicates.
#
# The two expressions below are deliberately built from the *same* pair, because
# `cancel-in-progress` is a property of the incoming run but its effect lands on
# older runs already in the group. A guard that varies run by run inside one
# group — the obvious `github.ref != 'refs/heads/main'` — can therefore let a run
# whose own ref is not main cancel a main run that is. Deriving the group and the
# guard from one pair makes the guard constant per group, which is the property
# that makes it sound.
#
#   effective repo = head repo of the PR, else this repo
#   effective ref  = head branch of the PR, else the pushed/dispatched branch
#
# The repo component is not decoration: without it a fork PR whose head branch is
# named `main` would land in this repository's `main` group and could cancel a
# real `main` run, leaving a merge commit with no green on record. With it, forks
# get their own groups and `main` runs serialise instead of superseding each
# other. Cancellation only ever hits the *older* run in a group, so the newest
# check run for a given name always belongs to the survivor and a cancelled
# `Verify (pinned Node)` can never mask a newer green one.
#
# `push:` stays at '**' on purpose. Narrowing it to main would delete CI for
# every branch pushed before its PR exists, which is most of them here, and would
# save nothing on the branches that do have one. `pull_request:` must never be
# narrowed at all: fork PRs generate no push event, and this workflow is the only
# gate that may safely see a fork.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ (github.event.pull_request.head.repo.full_name || github.repository) != github.repository || (github.event.pull_request.head.ref || github.ref_name) != 'main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (pinned Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency-purity check
        run: npm run check:purity

      - name: Content validation
        run: npm run check:content

      - name: Audio content validation
        run: npm run check:audio

      - name: Primitive coverage over v1 content
        run: npm run check:coverage

      - name: Test (unit + golden replay)
        run: npm test

      - name: Balance regression gate (five world years)
        # The committed baseline for the gate sweep, compared metric by metric.
        # Fails the build when a gated metric moves beyond its tolerance, and
        # equally when the baseline is missing — a gate that passes without one
        # reports green forever. Listed here by hand because this workflow does;
        # the self-hosted runner picks it up through `npm run verify`, which the
        # script is also part of. Both, or the two gates disagree.
        run: npm run balance:gate

      - name: Balance regression gate (twenty world years)
        # The same four cells and the same 200 runs, run to world-year twenty
        # instead of five, against its own baseline. It is a separate step and
        # not a longer version of the one above because the two answer different
        # questions: the fast gate is sensitive and cheap, and this one can see a
        # plateau that has not started yet at year five. Deleting either leaves a
        # blind spot the other does not cover — balance/README.md has the
        # measurements, and horizon-gate.test.ts fails if this step goes missing.
        run: npm run balance:gate:horizon

      - name: Balance regression gate (twenty world years, eight strategies)
        # Same horizon as the step above and a different pool, which is the
        # entire point. The two gates above run `passive-control` fixed, and
        # `passive-control` declares an empty preference list — so between them
        # their 400 runs submit no god intervention at all, and no change to any
        # of the fifteen verbs in coordination/src/god/interventions.ts can move
        # either of them by construction. That blind spot used to be covered
        # only by the two-hundred-year gate below, the most expensive instrument
        # here. This one covers it in about nine seconds. The single declared
        # difference from the step above is the pool, so a divergence between
        # them is attributable to god agency and to nothing else —
        # horizon-gate.test.ts fails if that stops being true.
        run: npm run balance:gate:agency

      - name: Balance regression gate (two hundred world years)
        # The third instrument, and the only one that can observe the win
        # condition. Measured: 0 of 400 runs ascended at twenty world years and
        # 10 of 80 at two hundred, so both gates above are structurally blind to
        # the ending of the game they gate. This one runs the whole eight-strategy
        # pool round-robin rather than the passive control, because a summit is
        # something a strategy reaches. It is not the horizon gate with a bigger
        # number and must not be merged into it — horizon-gate.test.ts fails if
        # this step goes missing or if any of the three horizons collapses into
        # another.
        run: npm run balance:gate:ascension

      # `check:consumption` is deliberately NOT here. It is expected to be red
      # until the effect pipeline is wired, so it runs in its own non-blocking
      # job at the bottom of this file. See that job for the condition under
      # which it moves back into this one.

  next-node:
    # Early warning only: a failure here means the next Node major may change
    # simulation behaviour, which we want to know about before it is pinned.
    # Node 23 is skipped deliberately — odd majors are already end-of-life.
    name: Next Node major (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `engines` pins Node 22, so npm prints an EBADENGINE warning here. That is
      # intended: the warning is the point, and engine-strict is left off so the
      # early-warning job can still run.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency-purity check
        run: npm run check:purity

      - name: Content validation
        run: npm run check:content

      - name: Audio content validation
        run: npm run check:audio

      - name: Primitive coverage over v1 content
        run: npm run check:coverage

      - name: Test (unit + golden replay)
        run: npm test

      - name: Balance regression gate (five world years)
        # The committed baseline for the gate sweep, compared metric by metric.
        # Fails the build when a gated metric moves beyond its tolerance, and
        # equally when the baseline is missing — a gate that passes without one
        # reports green forever. Listed here by hand because this workflow does;
        # the self-hosted runner picks it up through `npm run verify`, which the
        # script is also part of. Both, or the two gates disagree.
        run: npm run balance:gate

      - name: Balance regression gate (twenty world years)
        # The same four cells and the same 200 runs, run to world-year twenty
        # instead of five, against its own baseline. It is a separate step and
        # not a longer version of the one above because the two answer different
        # questions: the fast gate is sensitive and cheap, and this one can see a
        # plateau that has not started yet at year five. Deleting either leaves a
        # blind spot the other does not cover — balance/README.md has the
        # measurements, and horizon-gate.test.ts fails if this step goes missing.
        run: npm run balance:gate:horizon

      - name: Balance regression gate (twenty world years, eight strategies)
        # Same horizon as the step above and a different pool, which is the
        # entire point. The two gates above run `passive-control` fixed, and
        # `passive-control` declares an empty preference list — so between them
        # their 400 runs submit no god intervention at all, and no change to any
        # of the fifteen verbs in coordination/src/god/interventions.ts can move
        # either of them by construction. That blind spot used to be covered
        # only by the two-hundred-year gate below, the most expensive instrument
        # here. This one covers it in about nine seconds. The single declared
        # difference from the step above is the pool, so a divergence between
        # them is attributable to god agency and to nothing else —
        # horizon-gate.test.ts fails if that stops being true.
        run: npm run balance:gate:agency

      - name: Balance regression gate (two hundred world years)
        # The third instrument, and the only one that can observe the win
        # condition. Measured: 0 of 400 runs ascended at twenty world years and
        # 10 of 80 at two hundred, so both gates above are structurally blind to
        # the ending of the game they gate. This one runs the whole eight-strategy
        # pool round-robin rather than the passive control, because a summit is
        # something a strategy reaches. It is not the horizon gate with a bigger
        # number and must not be merged into it — horizon-gate.test.ts fails if
        # this step goes missing or if any of the three horizons collapses into
        # another.
        run: npm run balance:gate:ascension

      # `check:consumption` is deliberately NOT here. It is expected to be red
      # until the effect pipeline is wired, so it runs in its own non-blocking
      # job at the bottom of this file. See that job for the condition under
      # which it moves back into this one.

  consumption:
    # The measurement that says how much of the authored magic reaches the
    # simulation, reported on every commit and blocking nothing.
    #
    # `check:coverage` asks whether content *authors* each primitive; this asks
    # whether an authored node effect reaches anything the assembled simulation
    # applies. It is expected to be RED — at the time this job was split out,
    # 2 of 14 primitives were reachable from authored nodes, 2 were declared
    # exclusions, and 12 had no node-driven consumer at all. That is the finding
    # the check exists to publish, not a regression to be silenced.
    #
    # It is non-blocking because the wire that would turn it green (`w29`'s
    # `universe-effects.ts`, PR #42) is a different pull request. A gate held in
    # `npm run verify` while the thing it measures is unfixed cannot merge, and
    # the check that cannot merge is the check nobody sees.
    #
    # ## When to make this blocking again
    #
    # Move this step back into the two jobs above — and back into `verify` and
    # `verify:nosweeps` in package.json, so `scripts/ci-check.sh` picks it up
    # through the same gate — when, and only when:
    #
    #   every primitive has a node-driven consumer, or the remaining ones are
    #   declared exclusions
    #
    # "Declared exclusions" means the list in `packages/rules-magic/src/effects/
    # consumption.ts`, which is `fertility` and `lifespan` and has a reason:
    # both sit on 22 non-v1 nodes and are moved by species traits and blessing
    # constants rather than by anything a mage can learn. **Adding a primitive
    # to that list to make this job green is the exact failure the check exists
    # to catch.** The number in the FAIL line going down is the progress; the
    # list getting longer is not.
    name: Primitive consumption (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The check imports the built `dist/` of `content`, `rules-magic` and
      # `scenario`, because it assembles a real universe rather than grepping
      # sources. `typecheck` is `tsc --build`, so this is the build step.
      - name: Typecheck
        run: npm run typecheck

      - name: Primitive consumption (can knowledge move each primitive?)
        run: npm run check:consumption
